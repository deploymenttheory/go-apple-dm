name: Windows unit tests
description: Run both modules with the race detector and verify schema contracts on Windows.
runs:
  using: composite
  steps:
    - name: Start resource sampling
      shell: pwsh
      run: |
        $arguments = @('-NoProfile', '-File', (Join-Path $env:GITHUB_ACTION_PATH 'sample-resources.ps1'),
          '-Path', (Join-Path $env:RUNNER_TEMP 'windows-test-resources.log'),
          '-StopPath', (Join-Path $env:RUNNER_TEMP 'windows-test-resources.stop'))
        Start-Process pwsh -ArgumentList $arguments -WindowStyle Hidden
    - name: Windows library unit tests
      shell: pwsh
      env:
        CGO_ENABLED: '1'
      run: |
        New-Item -ItemType Directory -Force cover/unit | Out-Null
        $coverageDirectory = Join-Path $env:GITHUB_WORKSPACE 'cover/unit'
        go test -race -shuffle=on -count=1 -cover -coverpkg=github.com/deploymenttheory/go-apple-dm/... ./... -args "-test.gocoverdir=$coverageDirectory"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Windows server unit tests
      if: ${{ !cancelled() }}
      working-directory: server
      shell: pwsh
      env:
        CGO_ENABLED: '1'
      run: |
        $coverageDirectory = Join-Path $env:GITHUB_WORKSPACE 'cover/unit'
        go test -race -shuffle=on -count=1 -timeout 20m -cover '-coverpkg=github.com/deploymenttheory/go-apple-dm/...,github.com/deploymenttheory/go-apple-dm/server/...' ./... -args "-test.gocoverdir=$coverageDirectory"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Windows schema contracts
      if: ${{ !cancelled() }}
      shell: pwsh
      run: python scripts/device-management-schema-contracts.py --output cover/schema-contracts --coverage-dir cover/unit
    - name: Report runner resources after a failure
      if: ${{ failure() }}
      shell: pwsh
      run: |
        & (Join-Path $env:GITHUB_ACTION_PATH 'report-resources.ps1') -Path (Join-Path $env:RUNNER_TEMP 'windows-test-resources.log')
    - name: Stop resource sampling
      if: ${{ always() }}
      shell: pwsh
      run: New-Item -ItemType File -Force (Join-Path $env:RUNNER_TEMP 'windows-test-resources.stop') | Out-Null
