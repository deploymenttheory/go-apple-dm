name: Check server release assets

on:
  pull_request:
    paths:
      - '.github/workflows/release*.yml'
      - '.goreleaser.yaml'
      - 'release-please-config.json'
      - 'server/**'
      - '!server/**/*.md'
      - 'docs/operations/server-releases.md'
      - 'LICENSE'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release*.yml'
      - '.goreleaser.yaml'
      - 'release-please-config.json'
      - 'server/**'
      - '!server/**/*.md'
      - 'docs/operations/server-releases.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_VERSION: 0.0.0-ci
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.1
          args: check
      - name: Build all release targets without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.1
          args: release --clean --snapshot
      - name: Check archives and native executable versions
        run: |
          (cd dist && sha256sum --check "go-apple-dm-server_${SERVER_VERSION}_checksums.txt")
          mkdir "$RUNNER_TEMP/server-release"
          tar -xzf "dist/go-apple-dm-server_${SERVER_VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/server-release"
          test "$("$RUNNER_TEMP/server-release/dmserver" --version)" = "$SERVER_VERSION"
          test "$("$RUNNER_TEMP/server-release/dmctl" version)" = "$SERVER_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-release-preview
          path: |
            dist/go-apple-dm-server_*.tar.gz
            dist/go-apple-dm-server_*.zip
            dist/go-apple-dm-server_*_checksums.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test native workspace locking
        working-directory: server
        run: go test ./lab -run '^TestWorkspaceLockExcludesOtherHandles$' -count=1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-release-preview
          path: dist
      - name: Run packaged Windows executables
        shell: pwsh
        run: |
          Expand-Archive dist/go-apple-dm-server_0.0.0-ci_windows_amd64.zip -DestinationPath "$env:RUNNER_TEMP/server-release"
          $serverVersion = & "$env:RUNNER_TEMP/server-release/dmserver.exe" --version
          if ($LASTEXITCODE -ne 0 -or $serverVersion -ne '0.0.0-ci') { throw 'dmserver version mismatch' }
          $cliVersion = & "$env:RUNNER_TEMP/server-release/dmctl.exe" version
          if ($LASTEXITCODE -ne 0 -or $cliVersion -ne '0.0.0-ci') { throw 'dmctl version mismatch' }
