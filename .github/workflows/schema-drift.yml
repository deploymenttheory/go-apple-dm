name: Schema Drift

# Nightly: compare the pinned apple/device-management submodule against the
# upstream release and seed branches, regenerate, run conformance tests, and
# open or update a tracking issue when anything changed.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  schema-drift:
    name: '🍎 Apple schema drift'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Compare against upstream
        id: compare
        run: |
          set -euo pipefail
          pinned="$(git -C third_party/device-management rev-parse HEAD)"
          git -C third_party/device-management fetch -q origin 'refs/heads/*:refs/remotes/origin/*'
          release="$(git -C third_party/device-management rev-parse origin/release)"
          seeds="$(git -C third_party/device-management branch -r --list 'origin/seed_*' | sed 's#origin/##' | xargs)"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "seeds=$seeds" >> "$GITHUB_OUTPUT"
          {
            echo "## Apple device-management schema drift"
            echo
            echo "Pinned: \`$pinned\`  Upstream release: \`$release\`  Seed branches: $seeds"
            echo
            if [ "$pinned" != "$release" ]; then
              echo "### Files changed on release since pin"
              echo '```'
              git -C third_party/device-management diff --stat "$pinned" "$release" -- '*.yaml' | tail -60
              echo '```'
            else
              echo "release branch unchanged."
            fi
          } > drift.md
          if [ "$pinned" != "$release" ]; then echo "drift=true" >> "$GITHUB_OUTPUT"; else echo "drift=false" >> "$GITHUB_OUTPUT"; fi
      - name: Regenerate on upstream release and run conformance
        if: steps.compare.outputs.drift == 'true'
        continue-on-error: true
        run: |
          git -C third_party/device-management checkout -q "${{ steps.compare.outputs.release }}"
          make generate 2>&1 | tail -40
          { echo; echo "### Conformance on upstream release"; echo '```'; make test-conformance 2>&1 | tail -60; echo '```'; } >> drift.md
          { echo; echo "### Rename guard"; echo '```'; make verify 2>&1 | tail -40; echo '```'; } >> drift.md
      - name: Open or update tracking issue
        if: steps.compare.outputs.drift == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('drift.md', 'utf8');
            const title = 'Apple device-management schema drift';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'schema-drift' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['schema-drift'] });
            }
