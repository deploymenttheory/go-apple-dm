name: go | Linter

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.gitattributes'
      - '.golangci.yml'
      - '.golangci-version'
      - 'go.work'
      - 'Makefile'
      - 'scripts/lint.py'
      - 'scripts/lint_policy_test.py'
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  golint:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        module: [library, server]
        os: [ubuntu-24.04-arm, windows-latest]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            server/go.sum
      - name: Install pinned linter with the repository toolchain
        shell: bash
        run: |
          version="$(cat .golangci-version)"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$version"
      - name: Check lint policy boundaries
        if: matrix.module == 'library'
        run: python -m unittest discover -s scripts -p lint_policy_test.py
      - name: Compile and lint workspace module
        run: python scripts/lint.py --module "${{ matrix.module }}"
      - name: Retain module and platform reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-${{ matrix.module }}-${{ matrix.os }}
          path: cover/lint/
          if-no-files-found: ignore
