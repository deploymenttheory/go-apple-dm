name: go | Linter

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.gitattributes'
      - '.golangci.yml'
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  golint:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module: [library, server]
        os: [ubuntu-24.04-arm, windows-latest]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            server/go.sum
      - name: Install pinned linter with the repository toolchain
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Lint module
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
          GOWORK: 'off'
        run: |
          if [ "$MODULE" = server ]; then
            cd server
            golangci-lint run --fix=false --config=../.golangci.yml ./...
          else
            golangci-lint run --fix=false --config=.golangci.yml ./...
          fi
