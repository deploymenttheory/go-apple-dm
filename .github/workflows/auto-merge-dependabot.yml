name: Auto-Merge Dependabot


on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot-merge:
    name: '🤖 Auto-Merge Dependabot'
    runs-on: ubuntu-latest

    if: ${{ github.actor == 'dependabot[bot]' }}

    steps:
      
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check repository auto-merge setting
        id: repository
        run: |
          enabled=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.allow_auto_merge')
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report disabled auto-merge
        if: ${{ steps.repository.outputs.enabled != 'true' }}
        run: echo 'Auto-merge is disabled for this repository; leave this PR for manual merging.' >> "$GITHUB_STEP_SUMMARY"

      - name: Enable auto-merge for Dependabot PRs
        # Only if version bump is not a major version change
        if: ${{ steps.repository.outputs.enabled == 'true' && steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
