name: Security

on:
  pull_request:
    paths-ignore:
      - '.release-please-manifest.json'
      - 'docs/**'
      - '**/*.md'
  push:
    branches:
      - main
    # Run application CI when a push includes application or dependency changes.
    paths-ignore:
      - '.release-please-manifest.json'
      - 'docs/**'
      - '**/*.md'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    # Release-please PRs only prepare release metadata; normal changes retain CI.
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          github.head_ref != 'release-please--branches--main' }}
    name: '🛡️ govulncheck'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [library, server]
        include:
          - module: library
            dir: '.'
          - module: server
            dir: server
    env:
      GOWORK: 'off'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          cd "${{ matrix.dir }}"
          govulncheck ./...

  gosec:
    # Release-please PRs only prepare release metadata; normal changes retain CI.
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          github.head_ref != 'release-please--branches--main' }}
    name: '🔍 gosec SARIF'
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [library, server]
        include:
          - module: library
            dir: '.'
          - module: server
            dir: server
    env:
      GOWORK: 'off'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '${{ matrix.dir }}/go.mod'
          cache-dependency-path: '**/go.sum'
      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          cd "${{ matrix.dir }}"
          gosec -fmt sarif -out "$GITHUB_WORKSPACE/gosec-${{ matrix.module }}.sarif" ./...
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          sarif_file: gosec-${{ matrix.module }}.sarif
          category: gosec-${{ matrix.module }}

  docker-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify local credentials are excluded from Docker context
        run: scripts/check-docker-context.sh
