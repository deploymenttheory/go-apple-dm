name: go | Published server module installation

on:
  push:
    tags: ['server/v*']
  workflow_dispatch:
    inputs:
      version:
        description: Published server module version (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  server-module-installation:
    name: Published server dependencies, builds and command installation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: server/go.sum
      - name: Verify published server dependencies, package builds and command installation
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          GOPROXY: https://proxy.golang.org
        run: |
          version="${VERSION:-${REF_NAME#server/}}"
          python3 scripts/verify-server-module-installation.py --server-version "$version"
