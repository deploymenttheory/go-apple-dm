name: Onboarding quickstart

on:
  pull_request:
    paths:
      - 'docs/getting-started/**'
      - 'deploy/quickstart/**'
      - 'scripts/check-onboarding.py'
      - 'scripts/quickstart-smoke.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Makefile'
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - '.github/workflows/onboarding.yml'
  push:
    branches: [main]
    paths:
      - 'docs/getting-started/**'
      - 'deploy/quickstart/**'
      - 'scripts/check-onboarding.py'
      - 'scripts/quickstart-smoke.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Makefile'
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - '.github/workflows/onboarding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quickstart:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          github.head_ref != 'release-please--branches--main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            server/go.sum
      - name: Check guided onboarding and Compose lifecycle
        run: make test-quickstart
