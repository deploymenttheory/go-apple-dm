name: 'Dependency Review'
on:
  pull_request:
    paths-ignore:
      - '.release-please-manifest.json'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  dependency-review:
    # Release-please PRs only prepare release metadata; normal changes retain CI.
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          github.head_ref != 'release-please--branches--main' }}
    name: '🔎 Dependency Review'
    runs-on: ubuntu-latest
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
