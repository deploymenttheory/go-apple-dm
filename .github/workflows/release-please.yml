on:
  push:
    branches:
    - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    name: '🔖 Release Please'
    runs-on: ubuntu-latest
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    # The organization's release-please GitHub App mints a token per run,
    # avoiding dependence on an individual PAT owner's continued access.
    #
    # App credentials allow tag pushes to trigger release workflows.
    # If the App is unavailable, the next step uses the configured PAT.
    - uses: actions/create-github-app-token@v3
      id: app-token
      if: ${{ vars.RP_APP_ID != '' }}
      continue-on-error: true
      with:
        app-id: ${{ vars.RP_APP_ID }}
        private-key: ${{ secrets.RP_APP_PRIVATE_KEY }}

    - name: Which credential
      run: |
        if [ -n "${{ steps.app-token.outputs.token }}" ]; then
          echo "release-please is using the org's release-please App"
        else
          echo "::warning::App token unavailable (RP_APP_ID/RP_APP_PRIVATE_KEY unset, or the App is not installed here) — falling back to the repo PAT"
        fi

    - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        # Omit release-type to use manifest mode for both modules. Setting it
        # here selects single-package mode and bypasses the manifest's version
        # and pre-1.0 settings. Release types belong in release-please-config.json;
        # config-file and manifest-file use the default repository paths.
        token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_PAT }}
