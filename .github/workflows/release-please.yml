on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

name: release-please

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: '🔖 Release Please'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      server_release_created: ${{ steps.release.outputs['server--release_created'] }}
      server_tag: ${{ steps.release.outputs['server--tag_name'] }}
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      id: app-token
      with:
        app-id: ${{ vars.RP_APP_ID }}
        private-key: ${{ secrets.RP_APP_PRIVATE_KEY }}

    - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      id: release
      with:
        # Manifest mode releases the root library and server independently.
        token: ${{ steps.app-token.outputs.token }}
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
        target-branch: main

  server-binaries:
    needs: release-please
    # https://github.com/googleapis/release-please-action#path-outputs
    if: needs.release-please.outputs.server_release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.server_tag }}
    permissions:
      contents: write
      id-token: write
