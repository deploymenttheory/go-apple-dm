name: Apple Schema Compatibility Monitor

on:
  schedule:
    # Daily at 03:23 UTC. Seed discovery is independent of stable updates.
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Assess branches and retain proposed issues without publishing'
        type: boolean
        default: true

concurrency:
  group: apple-schema-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover stable and seed schema commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_branches: ${{ steps.discover.outputs.has_branches }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover immutable source commits
        id: discover
        run: python3 .github/scripts/schema_monitor.py discover --output "${RUNNER_TEMP}/schema-discovery/discovery.json"
      - name: Retain discovery even when upstream access fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-discovery
          path: ${{ runner.temp }}/schema-discovery/
          if-no-files-found: error
          retention-days: 30

  assess:
    name: Assess ${{ matrix.ref }}
    needs: discover
    if: ${{ needs.discover.outputs.has_branches == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            server/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schema-discovery
          path: ${{ runner.temp }}/schema-discovery/
      - name: Compare and test the selected candidate
        env:
          SCHEMA_BRANCH_KEY: ${{ matrix.key }}
        run: >-
          python3 .github/scripts/schema_monitor.py assess
          --manifest "${RUNNER_TEMP}/schema-discovery/discovery.json"
          --key "$SCHEMA_BRANCH_KEY" --output "${RUNNER_TEMP}/schema-assessments"
      - name: Retain findings and every completed check
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-assessment-${{ matrix.key }}
          path: ${{ runner.temp }}/schema-assessments/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish schema reports, engineering issues and previews
    needs: [discover, assess]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: schema-discovery
          path: ${{ runner.temp }}/schema-discovery/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: schema-assessment-*
          merge-multiple: true
          path: ${{ runner.temp }}/schema-assessments/
      - name: Obtain PR credential so preview CI runs automatically
        if: ${{ vars.RP_APP_ID != '' && !(github.event_name == 'workflow_dispatch' && inputs.report_only) }}
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.RP_APP_ID }}
          private-key: ${{ secrets.RP_APP_PRIVATE_KEY }}
      - name: Reconcile reports and publish only complete generated changes
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEMA_PR_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_PAT }}
          SCHEMA_REPORT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.report_only }}
          SCHEMA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=()
          if [ "$SCHEMA_REPORT_ONLY" = "true" ]; then args+=(--report-only); fi
          python3 .github/scripts/schema_monitor.py publish \
            --manifest "${RUNNER_TEMP}/schema-discovery/discovery.json" \
            --output "${RUNNER_TEMP}/schema-assessments" \
            --run-url "$SCHEMA_RUN_URL" "${args[@]}"
      - name: Show final branch outcomes
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/schema-assessments/summary.md" ]; then
            cat "${RUNNER_TEMP}/schema-assessments/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain publication summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-monitor-summary
          path: |
            ${{ runner.temp }}/schema-assessments/summary.md
            ${{ runner.temp }}/schema-assessments/proposed-issues.json
          retention-days: 30
