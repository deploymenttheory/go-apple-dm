name: Device Management Schema Update

# Weekly, and on demand: keep the generated schema current with Apple's
# apple/device-management repository. Compares the pinned submodule against the
# upstream release and seed branches, regenerates against upstream, runs the
# conformance tests and the rename guard, and opens or updates one tracking
# issue describing the update that is waiting.
#
# Apple publishes schema changes in bursts around OS releases rather than
# daily, and the tracking issue is updated in place rather than reopened, so a
# nightly run mostly rewrote the same issue with the same body. Weekly keeps
# the signal and drops the noise; workflow_dispatch covers the days when
# something has actually shipped and you do not want to wait.

on:
  schedule:
    # 03:23 UTC on Mondays.
    - cron: '23 3 * * 1'
  workflow_dispatch:

# A manual run during the scheduled one would race to update the same issue.
concurrency:
  group: device-management-schema-update
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  schema-update:
    name: '🍎 Device management schema update'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Compare against upstream
        id: compare
        run: |
          set -euo pipefail
          pinned="$(git -C third_party/device-management rev-parse HEAD)"
          git -C third_party/device-management fetch -q origin 'refs/heads/*:refs/remotes/origin/*'
          release="$(git -C third_party/device-management rev-parse origin/release)"
          seeds="$(git -C third_party/device-management branch -r --list 'origin/seed_*' | sed 's#origin/##' | xargs)"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "seeds=$seeds" >> "$GITHUB_OUTPUT"
          {
            echo "## Apple device management schema update"
            echo
            echo "Pinned: \`$pinned\`  Upstream release: \`$release\`  Seed branches: $seeds"
            echo
            if [ "$pinned" != "$release" ]; then
              echo "### Files changed on release since pin"
              echo '```'
              git -C third_party/device-management diff --stat "$pinned" "$release" -- '*.yaml' | tail -60
              echo '```'
            else
              echo "release branch unchanged."
            fi
          } > schema-update.md
          if [ "$pinned" != "$release" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Regenerate against upstream and run conformance
        if: steps.compare.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git -C third_party/device-management checkout -q "${{ steps.compare.outputs.release }}"
          make generate 2>&1 | tail -40
          { echo; echo "### Conformance on upstream release"; echo '```'; make test-conformance 2>&1 | tail -60; echo '```'; } >> schema-update.md
          { echo; echo "### Rename guard"; echo '```'; make verify 2>&1 | tail -40; echo '```'; } >> schema-update.md
      - name: Open or update the tracking issue
        if: steps.compare.outputs.changed == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('schema-update.md', 'utf8');
            const title = 'Apple device management schema update';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'schema-update' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['schema-update'] });
            }
