name: Device Management Client Schema Code Generation Monitor

on:
  schedule:
    # Daily at 03:23 UTC. Check the current pin and upcoming upstream schemas.
    - cron: '23 3 * * *'
  pull_request:
    paths:
      - '.github/scripts/device_management_client_schema*'
      - '.github/workflows/device-management-schema-update.yml'
      - 'scripts/device-management-schema-contracts.py'
      - 'scripts/device_management_schema_contracts_test.py'
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Check code generation and retain proposed issues without publishing'
        type: boolean
        default: true

concurrency:
  group: device-management-client-schema-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor-tests:
    name: Test Device Management Client Schema monitor
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test discovery, diagnostics, compilation and incident lifecycle
        run: python3 -B -m unittest discover -s .github/scripts -p 'device_management_client_schema*_test.py'
      - name: Test ordinary CI feature-contract runner
        run: python3 -B -m unittest discover -s scripts -p 'device_management_schema_contracts_test.py'

  discover:
    needs: monitor-tests
    if: github.event_name != 'pull_request'
    name: Discover current and future Device Management Client Schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_branches: ${{ steps.discover.outputs.has_branches }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover immutable source commits
        id: discover
        run: python3 .github/scripts/device_management_client_schema_monitor.py discover --output "${RUNNER_TEMP}/schema-discovery/discovery.json"
      - name: Retain immutable control and candidate snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/device_management_client_schema_monitor.py capture
          --manifest "${RUNNER_TEMP}/schema-discovery/discovery.json"
          --output "${RUNNER_TEMP}/schema-capture/capture.json"
      - name: Retain discovery even when upstream access fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-management-client-schema-discovery
          path: |
            ${{ runner.temp }}/schema-discovery/
            ${{ runner.temp }}/schema-capture/
          if-no-files-found: error
          retention-days: 30

  assess:
    name: Assess Device Management Client Schema ${{ matrix.ref }}
    needs: discover
    if: ${{ needs.discover.outputs.has_branches == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: device-management-client-schema-discovery
          path: ${{ runner.temp }}
      - name: Generate, verify and compile the selected schema
        env:
          SCHEMA_BRANCH_KEY: ${{ matrix.key }}
        run: >-
          python3 .github/scripts/device_management_client_schema_monitor.py assess
          --manifest "${RUNNER_TEMP}/schema-discovery/discovery.json"
          --key "$SCHEMA_BRANCH_KEY" --output "${RUNNER_TEMP}/schema-assessments"
      - name: Retain findings and every completed check
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-management-client-schema-assessment-${{ matrix.key }}
          path: ${{ runner.temp }}/schema-assessments/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Device Management Client Schema code generation incidents
    needs: [discover, assess]
    if: always() && github.event_name != 'pull_request' && needs.discover.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: device-management-client-schema-discovery
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: device-management-client-schema-assessment-*
          merge-multiple: true
          path: ${{ runner.temp }}/schema-assessments/
      - name: Reconcile code generation incidents
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEMA_REPORT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.report_only }}
          SCHEMA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=()
          if [ "$SCHEMA_REPORT_ONLY" = "true" ]; then args+=(--report-only); fi
          python3 .github/scripts/device_management_client_schema_monitor.py publish \
            --manifest "${RUNNER_TEMP}/schema-discovery/discovery.json" \
            --output "${RUNNER_TEMP}/schema-assessments" \
            --run-url "$SCHEMA_RUN_URL" "${args[@]}"
      - name: Show final branch outcomes
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/schema-assessments/summary.md" ]; then
            cat "${RUNNER_TEMP}/schema-assessments/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain publication summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-management-client-schema-summary
          path: |
            ${{ runner.temp }}/schema-assessments/summary.md
            ${{ runner.temp }}/schema-assessments/proposed-issues.json
            ${{ runner.temp }}/schema-assessments/publication.json
          retention-days: 30
