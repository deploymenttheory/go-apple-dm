name: Release server

on:
  # Called after Release Please has created the server release and version tag.
  workflow_call:
    inputs:
      tag:
        description: Existing server release tag (server/vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing server release tag (server/vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: server-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Validate tag before checkout
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^server/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Expected a server/vX.Y.Z release tag'
            exit 1
          fi
          echo "SERVER_VERSION=${RELEASE_TAG#server/v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Package server and CLI
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.18.1
          args: release --clean --snapshot
      - name: Verify packaged assets
        run: |
          (cd dist && sha256sum --check "go-apple-dm-server_${SERVER_VERSION}_checksums.txt")
          mkdir "$RUNNER_TEMP/server-release"
          tar -xzf "dist/go-apple-dm-server_${SERVER_VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/server-release"
          test "$("$RUNNER_TEMP/server-release/dmserver" --version)" = "$SERVER_VERSION"
          test "$("$RUNNER_TEMP/server-release/dmctl" version)" = "$SERVER_VERSION"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign checksums and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          checksum="dist/go-apple-dm-server_${SERVER_VERSION}_checksums.txt"
          cosign sign-blob --yes --bundle "$checksum.sigstore.json" "$checksum"
          gh release upload "$RELEASE_TAG" \
            dist/*.tar.gz dist/*.zip "$checksum" "$checksum.sigstore.json" --clobber
