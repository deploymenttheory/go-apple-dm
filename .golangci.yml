version: "2"

run:
  timeout: 15m
  modules-download-mode: readonly
  relative-path-mode: cfg
  tests: true
  concurrency: 2

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  new: false
  fix: false

linters:
  default: none
  enable:
    # Correctness and error handling.
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - errorlint
    - nilerr
    # HTTP, context and SQL resource ownership.
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    # Security and data handling, including authored tests and fixtures.
    - gosec
    - bidichk
    - durationcheck
    - makezero
    - forcetypeassert
    - musttag
    # Compiler directives, logging, test helpers and suppression hygiene.
    - gocheckcompilerdirectives
    - loggercheck
    - thelper
    - nolintlint
  settings:
    staticcheck:
      checks: ["SA*"]
    errorlint:
      # Wrapping is an API decision; comparisons and assertions must handle it.
      errorf: false
      asserts: true
      comparison: true
    errcheck:
      # Explicit discards are allowed for deliberately best-effort operations.
      # Never discard setup, persistence or validation errors to satisfy lint.
      check-blank: false
    nolintlint:
      require-specific: true
      require-explanation: true
      allow-unused: false
  exclusions:
    generated: strict
    warn-unused: true
    presets: []

formatters:
  enable: [gofumpt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/deploymenttheory/go-apple-dm]
  exclusions:
    generated: strict
    warn-unused: true

output:
  formats:
    text:
      path: stderr
      colors: false
  sort-order: [file, linter]
  show-stats: true
