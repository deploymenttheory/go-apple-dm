# Static HTTPS fixture origin for lab modules. It serves files only: no upload, no
# directory listing beyond the index, and no access to anything outside /srv.
server {
    listen 9443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.pem;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /srv;
    autoindex on;
    charset utf-8;

    # Apple clients require these types for manifests and packages.
    types {
        application/x-apple-aspen-config  mobileconfig;
        application/xml                   plist;
        application/octet-stream          pkg ipa dmg;
        text/html                         html;
        application/json                  json;
    }
    default_type application/octet-stream;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_except GET HEAD { deny all; }
    }
}
